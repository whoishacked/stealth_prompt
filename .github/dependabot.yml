version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-development:
        dependency-type: development
  - package-ecosystem: npm
    directory: "/extension"
    schedule:
      interval: weekly
    groups:
      extension-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
