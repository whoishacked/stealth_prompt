[project]
site_name = "Stealth Prompt"
site_description = "Browser-native, local-first security testing for AI agents."
site_author = "Stealth Prompt contributors"
site_url = "https://whoishacked.com/stealth_prompt/"
repo_url = "https://github.com/whoishacked/stealth_prompt"
repo_name = "whoishacked/stealth_prompt"
copyright = "Copyright &copy; 2026 Stealth Prompt contributors"

nav = [
  { "Home" = "index.md" },
  { "Get started" = "getting-started.md" },
  { "Use Stealth Prompt" = [
    { "Choose a connection" = "connections.md" },
    { "Run a test" = "testing.md" },
    { "Reports and evidence" = "reports.md" },
    { "Extension reference" = "extension.md" },
  ] },
  { "Reference" = [
    { "Security and privacy" = "security-and-privacy.md" },
    { "Troubleshooting" = "troubleshooting.md" },
  ] },
  { "Project" = [
    { "Product roadmap" = "product-roadmap.md" },
    { "Changelog" = "https://github.com/whoishacked/stealth_prompt/blob/main/CHANGELOG.md" },
  ] },
]

[project.theme]
logo = "assets/logo.png"
favicon = "assets/favicon.png"
font = false
features = [
  "content.action.view",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.toc]
permalink = true
